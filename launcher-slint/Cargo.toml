[package]
name = "twitch_launcher"
version = "1.0.0"
edition = "2021"
authors = ["Twitch mpv Overlay Developers"]
description = "Native Rust desktop launcher and companion manager for Twitch stream & chat overlay"
license = "MIT"

[dependencies]
slint = "1.18"
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
open = "5.3"
rfd = "0.15"
log = "0.4"

[build-dependencies]
slint-build = "1.18"
