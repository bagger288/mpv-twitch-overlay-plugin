[package]
name = "twitch_chat_mpv"
version = "1.0.0"
edition = "2021"
authors = ["Twitch mpv Overlay Developers"]
description = "High-performance native mpv C-plugin for real-time Twitch stream chat overlay with emotes and badges"
license = "MIT"

[lib]
name = "twitch_chat"
crate-type = ["cdylib"]

[dependencies]
# Serialization & Fast JSON parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# High-performance pure-Rust 2D rendering & rasterization
tiny-skia = "0.11"

# Pure-Rust ultra-fast font rasterizer (zero C/C++ dependencies)
fontdue = "0.9"

# Image decoding for emotes and badges (PNG, WebP, JPEG)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Utilities
parking_lot = "0.12"
log = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
